apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-monitoring-kube-prometheus-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'mcp-webhook'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 5m
    receivers:
      - name: 'mcp-webhook'
        webhook_configs:
          - url: 'http://mcp-server-service.default.svc.cluster.local:9000/webhook/alert'
            send_resolved: false