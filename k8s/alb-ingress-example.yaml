apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alb-demo
  template:
    metadata:
      labels:
        app: alb-demo
    spec:
      containers:
        - name: alb-demo
          image: hashicorp/http-echo
          args:
            - "-text=Hello from EMA Backtester ALB test, Session E"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: alb-demo-service
spec:
  selector:
    app: alb-demo
  ports:
    - port: 80
      targetPort: 5678
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-demo-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alb-demo-service
                port:
                  number: 80
