apiVersion: v1
kind: ServiceAccount
metadata:
  name: ema-backtester-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ema-backtester-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["postgres-credentials"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ema-backtester-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ema-backtester-sa
    namespace: default
roleRef:
  kind: Role
  name: ema-backtester-role
  apiGroup: rbac.authorization.k8s.io