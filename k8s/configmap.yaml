apiVersion: v1
kind: ConfigMap
metadata:
  name: backtester-config
  namespace: default
data:
  # Non-sensitive database configuration
  DB_HOST: "postgres-postgresql.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "backtestdb"
  DB_USER: "backtester"

  # Application configuration
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  BACKTESTER_SYMBOL: "^NSEI"
  BACKTESTER_PERIOD: "1y"
  EMA_SHORT: "9"
  EMA_LONG: "21"