apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backtester-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: ema-backtester

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow incoming traffic on port 8000 (API requests)
    - ports:
        - protocol: TCP
          port: 8000

  egress:
    # Allow outgoing traffic to PostgreSQL only
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432

    # Allow DNS resolution (required for all pods)
    - ports:
        - protocol: UDP
          port: 53